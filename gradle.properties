# Project-wide Gradle settings.

# Memoria y recolector de basura optimizado (3.5 GB para no asfixiar el sistema)
org.gradle.jvmargs=-Xmx3584m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Habilita paralelismo y limita workers para cuidar tu Ryzen 5 (evita sobrecalentamiento)
org.gradle.parallel=true
org.gradle.workers.max=6

# Caché de compilación y configuración
org.gradle.caching=true
org.gradle.configuration-cache=true

# Mantener el daemon activo en segundo plano
org.gradle.daemon=true

# Kotlin style
kotlin.code.style=official

# AndroidX y deshabilitar Jetifier si tus librerías son modernas
android.useAndroidX=true
android.enableJetifier=false
